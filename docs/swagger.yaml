basePath: /
definitions:
  dto.AddressSuggestion:
    properties:
      lat:
        type: number
      lon:
        type: number
      value:
        type: string
    type: object
  dto.AttachmentResponse:
    properties:
      duration_ms:
        type: integer
      file_name:
        type: string
      height:
        type: integer
      mime_type:
        type: string
      size:
        type: integer
      url:
        type: string
      width:
        type: integer
    type: object
  dto.AuthTokensResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  dto.ChatResponse:
    properties:
      id:
        type: integer
      is_read_only:
        type: boolean
      last_message_text:
        type: string
      meetup:
        $ref: '#/definitions/dto.MeetupResponse'
      meetup_id:
        type: integer
      title:
        type: string
      type:
        type: string
      unread_count:
        type: integer
    type: object
  dto.Coordinates:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  dto.CreateMeetupRequest:
    properties:
      address:
        type: string
      coordinates:
        allOf:
        - $ref: '#/definitions/dto.Coordinates'
        description: Вложенный JSON
      cover_file_id:
        type: string
      description:
        type: string
      end_time:
        type: string
      is_public:
        type: boolean
      start_time:
        type: string
      tags:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      login:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  dto.MeetupResponse:
    properties:
      address:
        type: string
      coordinates:
        $ref: '#/definitions/dto.Coordinates'
      cover_url:
        type: string
      creator:
        $ref: '#/definitions/dto.ProfileResponse'
      creator_id:
        type: integer
      description:
        type: string
      distance_meters:
        type: integer
      end_time:
        type: string
      id:
        type: integer
      invite_token:
        type: string
      is_member:
        type: boolean
      is_public:
        type: boolean
      participants:
        items:
          $ref: '#/definitions/dto.ProfileResponse'
        type: array
      participants_count:
        type: integer
      start_time:
        type: string
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      title:
        type: string
    type: object
  dto.MessagePreview:
    properties:
      content:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      sender_display_name:
        type: string
      sender_id:
        type: integer
    type: object
  dto.MessageResponse:
    properties:
      attachment:
        $ref: '#/definitions/dto.AttachmentResponse'
      chat_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      edited_at:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      message_type:
        type: string
      reply_to:
        $ref: '#/definitions/dto.MessagePreview'
      request_id:
        type: string
      sender:
        $ref: '#/definitions/dto.ProfileResponse'
      sender_id:
        type: integer
    type: object
  dto.PresenceResponse:
    properties:
      display_name:
        type: string
      last_seen:
        type: integer
      online:
        type: boolean
      user_id:
        type: integer
    type: object
  dto.ProfileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_organizer:
        type: boolean
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  dto.RegisterResponse:
    properties:
      registration_id:
        type: string
    type: object
  dto.ResendCodeRequest:
    properties:
      email:
        type: string
      registration_id:
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        type: string
    type: object
  dto.TagResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.UpdateMeetupRequest:
    properties:
      address:
        type: string
      coordinates:
        $ref: '#/definitions/dto.Coordinates'
      cover_file_id:
        type: string
      description:
        type: string
      end_time:
        type: string
      is_public:
        type: boolean
      start_time:
        type: string
      tags:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_file_id:
        type: string
      bio:
        type: string
      display_name:
        type: string
      tags:
        items:
          type: integer
        type: array
      username:
        type: string
    type: object
  dto.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
      registration_id:
        type: string
      username:
        type: string
    type: object
  handler.EditMessageRequest:
    properties:
      content:
        example: Исправленный текст
        type: string
    type: object
  handler.SendMessageRequest:
    properties:
      content:
        example: Привет, как дела?
        type: string
      file_id:
        example: 6f5e4d3c-2b1a-...
        type: string
      reply_to_message_id:
        example: 42
        type: integer
      request_id:
        description: |-
          RequestID — клиентский idempotency key (UUID). Повторный POST с тем же
          request_id не создаёт дубль, а возвращает уже созданное сообщение (200).
        example: a1b2c3d4-...
        type: string
    type: object
  handler.googleLoginRequest:
    properties:
      token:
        type: string
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  response.ValidationErrorResponse:
    properties:
      error:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
    type: object
info:
  contact: {}
  description: API Server for Mobile Application "Meetuper"
  title: Offline Meetup API
  version: "1.0"
paths:
  /v1/account:
    delete:
      description: 'Мягкое удаление с анонимизацией: email обнуляется, привязки соцсетей
        и пароль удаляются, все refresh-токены отзываются. Сообщения и прошедшие митапы
        остаются, автор отображается как «Удалённый пользователь». Восстановление
        невозможно.'
      produces:
      - application/json
      responses:
        "204":
          description: Аккаунт удалён
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Аккаунт уже удалён
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить свой аккаунт
      tags:
      - account
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Принимает login (email или username) и всегда отвечает 202 — независимо
        от того, существует ли такой аккаунт, чтобы эндпоинт не подсказывал, какие
        аккаунты зарегистрированы. Код для сброса отправляется на email, только если
        аккаунт найден.
      parameters:
      - description: Login
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ValidationErrorResponse'
      summary: Запросить сброс пароля
      tags:
      - Auth
  /v1/auth/google:
    post:
      consumes:
      - application/json
      description: Принимает ID Token от Google SDK, возвращает JWT.
      parameters:
      - description: Google ID Token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.googleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход через Google
      tags:
      - Auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Принимает login (email или username — определяется по наличию '@')
        и пароль, возвращает пару токенов. Неизвестный login и неверный пароль дают
        одинаковую ошибку.
      parameters:
      - description: Login, пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthTokensResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход по email/username и паролю
      tags:
      - Auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Отзывает переданный refresh_token. Идемпотентно.
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      responses:
        "204":
          description: No Content
      summary: Выход
      tags:
      - Auth
  /v1/auth/me:
    get:
      description: Возвращает ID, email, роль и статус.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить данные моего аккаунта
      tags:
      - Auth
  /v1/auth/password:
    patch:
      consumes:
      - application/json
      description: Меняет пароль текущего аккаунта. Если у аккаунта ещё нет пароля
        (вход был только через Google/Telegram), current_password не проверяется.
        Все refresh-токены пользователя отзываются, включая тот, которым выполнен
        этот запрос — клиент должен быть готов заново выполнить вход (или получить
        401 при следующем refresh).
      parameters:
      - description: Текущий и новый пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Сменить пароль
      tags:
      - Auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Принимает refresh_token, ротирует его и возвращает новую пару токенов.
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthTokensResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Обновить токены
      tags:
      - Auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт «ожидающую» регистрацию и отправляет код подтверждения
        на email. Пользователь в БД не создаётся до подтверждения. Ответ одинаков
        независимо от того, существует ли уже аккаунт с таким email. Возвращает registration_id
        — его нужно прислать обратно в /verify-email и /resend-code.
      parameters:
      - description: Email, username, пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ValidationErrorResponse'
      summary: Регистрация по email и паролю
      tags:
      - Auth
  /v1/auth/resend-code:
    post:
      consumes:
      - application/json
      description: Генерирует новый код для незавершённой регистрации, адресованной
        парой (email, registration_id). Отвечает 202 и в том случае, когда такой незавершённой
        регистрации нет — чтобы эндпоинт не подсказывал, какие email заняты.
      parameters:
      - description: Email и registration_id из /register
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ResendCodeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ValidationErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Отправить код подтверждения повторно
      tags:
      - Auth
  /v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Проверяет код из письма и устанавливает новый пароль. Не логинит
        — все refresh-токены пользователя отзываются.
      parameters:
      - description: Email, код, новый пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ValidationErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Завершить сброс пароля
      tags:
      - Auth
  /v1/auth/telegram/callback:
    get:
      description: Принимает GET параметры от Telegram, валидирует, логинит и редиректит
        в приложение с токеном.
      responses: {}
      summary: Callback для виджета Telegram
      tags:
      - Auth
  /v1/auth/telegram/login:
    get:
      description: Возвращает HTML-страницу с Telegram Login Widget для авторизации
        пользователя через Telegram
      produces:
      - text/html
      responses:
        "200":
          description: HTML page with Telegram login widget
          schema:
            type: string
      summary: Вход через Telegram
      tags:
      - Auth
  /v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Проверяет код из письма, создаёт аккаунт (или добавляет пароль
        к существующему) и возвращает пару токенов. Требует registration_id из ответа
        /register. Если username заняли, пока код был в пути, вернётся 409 — повторите
        запрос с другим username.
      parameters:
      - description: Email, registration_id, код, опционально другой username
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthTokensResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ValidationErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Подтвердить email и завершить регистрацию
      tags:
      - Auth
  /v1/chats:
    get:
      description: Возвращает список всех чатов (групповых и личных), в которых состоит
        текущий авторизованный пользователь. Отсортированы по активности (чаты с новыми
        сообщениями — сверху). Включает текст последнего сообщения и счетчик непрочитанных.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ChatResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список чатов пользователя
      tags:
      - Chats
  /v1/chats/{id}/messages:
    get:
      description: Возвращает историю сообщений для конкретного чата. Поддерживает
        cursor-based пагинацию. Пользователь должен быть участником чата.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: ID последнего полученного сообщения (для пагинации, по умолчанию
          0)
        in: query
        name: cursor
        type: integer
      - description: Лимит сообщений (по умолчанию 50, максимум 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MessageResponse'
            type: array
        "400":
          description: Неверный ID чата или параметры
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение сообщений чата
      tags:
      - Chats
    post:
      consumes:
      - application/json
      description: Сохраняет новое сообщение в базу и моментально рассылает его онлайн-участникам
        чата через WebSockets.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправка сообщения
      tags:
      - Chats
  /v1/chats/{id}/messages/{messageId}:
    delete:
      description: Удаляет своё сообщение (мягкое удаление). Удалять может только
        автор. Удаление рассылается участникам чата через WebSocket.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: ID сообщения
        in: path
        name: messageId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Удалено
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Не автор сообщения
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Сообщение не найдено
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление сообщения
      tags:
      - Chats
    patch:
      consumes:
      - application/json
      description: Меняет текст своего сообщения. Редактировать может только автор.
        Изменение рассылается участникам чата через WebSocket.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: ID сообщения
        in: path
        name: messageId
        required: true
        type: integer
      - description: Новый текст
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.EditMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Не автор сообщения
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Сообщение не найдено
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Редактирование сообщения
      tags:
      - Chats
  /v1/chats/{id}/presence:
    get:
      description: Возвращает онлайн-статус и время последнего визита для всех участников
        чата. Вызывающий должен быть участником.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PresenceResponse'
            type: array
        "400":
          description: Неверный ID чата
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Нет доступа к чату
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Присутствие участников чата
      tags:
      - Chats
  /v1/files/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Медиафайл
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Загрузить медиафайл (фото/видео/аудио)
      tags:
      - Files
  /v1/geo/suggest:
    get:
      description: Ищет адреса и возвращает координаты
      parameters:
      - description: 'Часть адреса (например: москва лен)'
        in: query
        name: address_part
        type: string
      - description: Широта
        in: query
        name: lat
        type: string
      - description: Долгота
        in: query
        name: lon
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AddressSuggestion'
            type: array
      security:
      - BearerAuth: []
      summary: Подсказки адресов (DaData)
      tags:
      - Geo
  /v1/meetups:
    get:
      description: Возвращает список митапов. Если переданы lat/lng/radius — ищет
        ближайшие. Иначе сортирует по времени.
      parameters:
      - description: Широта (Latitude)
        in: query
        name: lat
        type: number
      - description: Долгота (Longitude)
        in: query
        name: lng
        type: number
      - description: Радиус поиска (в метрах)
        in: query
        name: radius
        type: integer
      - description: 'Лимит записей (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Смещение (pagination)
        in: query
        name: offset
        type: integer
      - description: 'ID тегов через запятую (например: 1,2,5)'
        in: query
        name: tags
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MeetupResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Поиск и список митапов
      tags:
      - Meetups
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные митапа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMeetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать митап
      tags:
      - Meetups
  /v1/meetups/{id}:
    delete:
      description: Удаляет митап (Soft Delete). Требует прав создателя (owner).
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить митап
      tags:
      - Meetups
    get:
      description: Возвращает детальную информацию о митапе.
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeetupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить митап по ID
      tags:
      - Meetups
    patch:
      consumes:
      - application/json
      description: Частичное обновление полей митапа. Требует прав создателя (owner).
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления (nil поля игнорируются)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMeetupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeetupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить митап
      tags:
      - Meetups
  /v1/meetups/{id}/join:
    post:
      description: Добавляет текущего пользователя в список участников публичного
        митапа.
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успехе или пустой JSON
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Митап приватный
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Митап не найден
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Уже участник
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Вступить в митап
      tags:
      - Meetups
  /v1/meetups/{id}/leave:
    post:
      description: Удаляет текущего пользователя из участников.
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Покинуть митап
      tags:
      - Meetups
  /v1/meetups/join/{token}:
    post:
      description: Вступление по инвайт-ссылке/токену
      parameters:
      - description: Invite Token (UUID)
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Вступить в приватный митап
      tags:
      - Meetups
  /v1/meetups/my:
    get:
      description: Возвращает митапы текущего пользователя. По умолчанию (или filter=joined)
        — куда записан. Если filter=created — которые организовал.
      parameters:
      - description: 'Фильтр роли: ''joined'' (участник) или ''created'' (организатор)'
        enum:
        - joined
        - created
        in: query
        name: filter
        type: string
      - description: 'Лимит записей (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Смещение (pagination)
        in: query
        name: offset
        type: integer
      - description: Показать посещенные митапы (прошедшие)
        in: query
        name: show_past
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MeetupResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои митапы
      tags:
      - Meetups
  /v1/profile:
    get:
      description: Возвращает профиль текущего пользователя вместе с тегами.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить мой профиль
      tags:
      - Profile
    patch:
      consumes:
      - application/json
      description: Обновляет никнейм, био, аватар и теги (передавать ID тегов).
      parameters:
      - description: Данные для обновления профиля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить мой профиль
      tags:
      - Profile
  /v1/profile/{id}:
    get:
      description: Возвращает публичный профиль пользователя по его ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить профиль пользователя
      tags:
      - Profile
  /v1/tags:
    get:
      description: Возвращает справочник всех доступных тегов/интересов.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TagResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить список тегов
      tags:
      - Tags
  /v1/ws:
    get:
      description: Открывает постоянное WebSocket соединение для получения событий
        чата (новые сообщения, статусы). Требуется Bearer токен в заголовке Authorization.
      responses:
        "101":
          description: Switching Protocols (Успешное подключение)
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Ошибка при апгрейде соединения
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Установка WebSocket соединения
      tags:
      - WebSockets
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer <your-token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
